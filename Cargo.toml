[package]
name = "donkr"
version = "0.1.0"
edition = "2021"
description = "The dating app for donkeys. Powered by Studbase (it's SQLite)."
license = "MIT"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
maud = "0.26"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.5", features = ["fs"] }
